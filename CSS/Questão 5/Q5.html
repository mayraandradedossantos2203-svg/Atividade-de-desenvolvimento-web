<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 5 - Menu Horizontal</title>
    <style>
        /* Resolução da Questão 5 */
        #menu {
            list-style-type: none;    /* 1. Remove os marcadores */
            padding: 0;
            display: flex;            /* 2. Alinha os itens lado a lado */
            gap: 15px;                /* 3. Aplica o espaçamento de 15px */
        }

        /* Estética básica para os links (opcional) */
        #menu li a {
            text-decoration: none; 
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <nav>
        <ul id="menu">
            <li><a href="#">início</a></li>
            <li><a href="#">Disciplinas</a></li>
            <li><a href="#">Projetos</a></li>
            <li><a href="#">Material de apoio</a></li>
        </ul>
    </nav>

</body>
</html>
