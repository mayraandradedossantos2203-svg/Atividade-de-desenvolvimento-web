<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Questões  10</title>
    <style>
       
    
        /* Estilo do Botão (Questão 10) */
        .btn {
            background-color: #2ecc71; /* Verde */
            color: yellow !important;;
            padding: 12px 25px;
            border: none;
            border-radius: 20px;       /* Arredondado */
            cursor: pointer;           /* Mãozinha */
            font-size: 16px;
            transition: 0.3s;
        }

        .btn:hover {
            background-color: #3498db; /* Verde mais escuro no hover */
        }
    </style>
</head>
<body>

    

    <hr>

    <h2>Questão 10</h2>
    <button class="btn">Clique Aqui</button>

</body>
</html>
