<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Questão 07 - Formulário</title>
</head>
<body>

    <h2>Cadastro de Usuário</h2>

    <form action="#" method="post">
        <p>
            <label for="nome">Nome:</label><br>
            <input type="text" id="nome" name="nome" required>
        </p>

        <p>
            <label for="email">E-mail:</label><br>
            <input type="email" id="email" name="email" required>
        </p>

        <p>
            <label for="senha">Senha:</label><br>
            <input type="password" id="senha" name="senha" required>
        </p>

        <p>
            <label for="data_nasc">Data de Nascimento:</label><br>
            <input type="date" id="data_nasc" name="data_nasc">
        </p>

        <p>
            <label for="escolaridade">Escolaridade:</label><br>
            <select id="escolaridade" name="escolaridade">
                <option value="medio">Ensino Médio</option>
                <option value="graduacao">Graduação</option>
                <option value="pos">Pós-graduação</option>
            </select>
        </p>

        <p>
            <label>Gênero:</label><br>
            <input type="radio" id="masc" name="genero" value="masculino">
            <label for="masc">Masculino</label>
            <input type="radio" id="fem" name="genero" value="feminino">
            <label for="fem">Feminino</label>
        </p>

        <p>
            <input type="checkbox" id="termos" name="termos">
            <label for="termos">Aceito os termos de uso</label>
        </p>

        <p>
            <button type="submit">Enviar Dados</button>
        </p>
    </form>

</body>
</html>
