<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo de Tabela Semântica</title>
    <style>
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 8px;
        }
        tfoot {
            font-weight: bold;
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>

    <h1>Questão 06: Tabela com thead, tbody e tfoot</h1>

    <table>
        <thead>
            <tr>
                <th>Produto</th>
                <th>Quantidade</th>
                <th>Valor</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>computador</td>
                <td>1</td>
                <td>R$ 3.000,00</td>
            </tr>
            <tr>
                <td>Mouse</td>
                <td>1</td>
                <td>R$ 50,00</td>
            </tr>
            <tr>
                <td>Monitor</td>
                <td>1</td>
                <td>R$ 1.200,00</td>
            </tr>
            <tr>
                <td>teclado</td>
                <td>1</td>
                <td>R$ 150,00</td>
            </tr>
            <tr>
                <td>Cabo HDMI</td>
                <td>1</td>
                <td>R$ 25,00</td>
            </tr>
        </tbody>

        <tfoot>
            <tr>
                <td colspan="2">Total Geral (Estimado)</td>
                <td>R$ 4.425,00</td>
            </tr>
        </tfoot>
    </table>

</body>
</html>
