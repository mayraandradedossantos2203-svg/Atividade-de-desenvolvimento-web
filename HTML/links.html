<!DOCTYPE html>
<html 
<head>
    <meta charset="UTF-8">
    <title>Links Simples</title>
    <style>
        body { height: 600px; }
        #secao-final { margin-top: 300px; background-color: #eee; padding: 10px; }
    </style>
</head>
<body>

    <h1>Exemplo de Links </h1>

    <p>
        1. link para o google: 
        <a href="https://www.google.com" target="_blank">Visitar Google</a>
    </p>

    <p>
        2. link interno para outro arquivo: 
        <a href="listas.html">Ver Listas</a>
    </p>

    <p>
        3. link mailto para e-mail: 
        <a href="mailto:seu.nome@exemplo.com">Enviar E-mail</a>
    </p>

    <p>
        4. link âncora para seção dentro da página: 
        <a href="#secao-final">Ir para o Rodapé</a>
    </p>

    <div id="secao-final">
        <h3>Seção Final da Página</h3>
        <p>Este é o destino do link âncora.</p>
    </div>

</body>
</html>
