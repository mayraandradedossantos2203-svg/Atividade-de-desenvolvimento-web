<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 01 - Cálculo de Área</title>
</head>
<body>

    <h1>Cálculo da Área do Triângulo</h1>
    <p>Os resultados aparecerão no alerta e no console (F12).</p>

    <script>
        
        
        let base = parseFloat(prompt("Digite o valor da base:"));
        let altura = parseFloat(prompt("Digite o valor da altura:"));

        
        let area = (base * altura) / 2;

       
        alert("O resultado da área é: " + area);
        console.log("Resultado da Área: ", area);
    </script>

</body>
</html>
